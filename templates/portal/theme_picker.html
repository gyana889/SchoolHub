    <button type="button" class="theme-swatch" data-theme-choice="sage" aria-label="Sage theme" title="Sage" aria-pressed="true"></button>
    <button type="button" class="theme-swatch" data-theme-choice="sky" aria-label="Sky theme" title="Sky" aria-pressed="false"></button>
    <button type="button" class="theme-swatch" data-theme-choice="rose" aria-label="Rose theme" title="Rose" aria-pressed="false"></button>
    <button type="button" class="theme-swatch" data-theme-choice="amber" aria-label="Amber theme" title="Amber" aria-pressed="false"></button>
    <button type="button" class="theme-swatch" data-theme-choice="white" aria-label="White theme" title="White" aria-pressed="false"></button>
</div>
