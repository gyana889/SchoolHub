{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f3">
    <title>{% block title %}SchoolHub{% endblock %}</title>
    <script>
        try {
            const theme = localStorage.getItem('schoolhub-theme');
            if (['sage', 'sky', 'rose', 'amber', 'white'].includes(theme)) document.documentElement.dataset.theme = theme;
            else if (theme) localStorage.setItem('schoolhub-theme', 'sage');
        } catch (error) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'portal/css/style.css' %}?v=10">
    <link rel="stylesheet" href="{% static 'portal/css/access_control.css' %}?v=1">
    <link rel="stylesheet" href="{% static 'portal/css/enrollment.css' %}?v=1">
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <script src="{% static 'portal/js/app.js' %}?v=8" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
</body>
</html>
